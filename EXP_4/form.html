<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <titleExp-1</title>
</head>
<body>
    <h1>Hotel Room Booking Form</h1>
<form action="#" method="post"
<label for="fullname">Full Name:</label>
<input type="text" id="fullname" required>
<br><br>
<label for="email">Email:</label>
<input type="text" id="email" required>
<br><br>
<label for="phone">Phone:</label>
<input type="text" id="phone" required>
<br><br>
<label for="checkin">Check-in Date:</label>
<input type="date" id="checkin" required>
<br><br>
<label for="checkout">Check-out Date:</label>
<input type="date" id="checkout" required>
<br><br>
<label for="room">Room Type:</label>
<select id="room" required>
    <option value="">Select Room Type</option>
    <option value="single">Double Room</option>
    <option value="double">Deluxe Room</option>  
    <option value="suite">Suite</option>
    <br><br>
<label for="guests">No. Of Guests:</label>
<input type="number" id="guests" min="1" max="4" required>
<br><br>
<label for="Special Requests">"Special Requests"</label>
<br><br>
<textarea id="Special_Requests" rows="4" cols="50"></textarea>
<br>
<input type="reset" value="Reset Now" required>
<input type="submit" value="Submit Now" required>
  </select>
  </form>    
  <br><br>
</body>
</html>
